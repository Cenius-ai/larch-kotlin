<th:block th:replace="~{layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">
    <div class="container-fluid px-4 py-4">
        <div class="form-page-wrapper">
            <h1 class="display-5 fw-bold mb-4">Add New Holding</h1>

            <div th:if="${error != null}" class="alert alert-danger">
                <p class="mb-0" th:text="${error}">Error message</p>
            </div>

            <form method="post" action="/holdings/add" class="add-holding-form">
                <div class="mb-4">
                    <label for="assetId" class="form-label fw-semibold">Asset</label>
                    <select id="assetId" name="assetId" class="form-select form-select-lg" required>
                        <option value="">&mdash; Select an asset &mdash;</option>
                        <option th:each="a : ${assets}"
                                th:value="${a.first}"
                                th:text="${a.second}"
                                th:selected="${selectedAssetId != null and selectedAssetId == a.first.toString()}">
                            BTC &mdash; Bitcoin
                        </option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="quantity" class="form-label fw-semibold">Quantity</label>
                    <input type="number" id="quantity" name="quantity" class="form-control form-control-lg"
                           step="any" min="0.00000001" placeholder="e.g. 1.5"
                           th:value="${quantityValue}" required>
                    <div class="form-text">Enter the number of tokens you hold.</div>
                </div>

                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-accent btn-lg px-5">Add Holding</button>
                    <a href="/holdings" class="btn btn-outline-secondary btn-lg">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</th:block>

<th:block th:fragment="scripts">
    <!-- no extra scripts needed -->
</th:block>
</th:block>
